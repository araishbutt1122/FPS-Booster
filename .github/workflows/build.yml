name: Build FPS Booster Pro APK & AAB

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Bundle to Android Assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          ls -lh android/app/src/main/assets/public

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate Release Keystore (if not provided)
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/keystore.jks" ]; then
            keytool -genkeypair -v -keystore android/app/keystore.jks -alias fpsbooster -keyalg RSA -keysize 2048 -validity 10000 -storepass fpsbooster120 -keypass fpsbooster120 -dname "CN=FPS Booster, OU=Gaming, O=FPS Booster Pro, L=City, S=State, C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          if [ ! -f "android/gradlew" ]; then
            gradle wrapper --gradle-version 8.13 --project-dir android
          fi
          chmod +x android/gradlew

      - name: Build Android Debug & Release APK + Release AAB
        working-directory: android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Verify APK & AAB Outputs
        run: |
          echo "=== Searching generated APKs and AABs ==="
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} \;

          mkdir -p android/app/build/outputs/apk/release
          mkdir -p android/app/build/outputs/bundle/release

          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            UNSIGNED_APK=$(find android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
            if [ -n "$UNSIGNED_APK" ]; then
              cp "$UNSIGNED_APK" android/app/build/outputs/apk/release/app-release.apk
            fi
          fi

          if [ ! -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            echo "ERROR: app-release.apk was not generated!"
            exit 1
          fi

          if [ ! -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "ERROR: app-release.aab was not generated!"
            exit 1
          fi

          ls -lh android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
