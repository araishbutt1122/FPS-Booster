name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -rf android
          npx cap add android
      - run: npm run build
      - run: npx cap sync android
      - name: Fix Duplicate Kotlin - Real Fix
        run: |
          python3 << 'PYEOF'
          p = 'android/app/build.gradle'
          t = open(p).read()
          fix = """
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          """
          if 'resolutionStrategy' not in t:
              t = fix + "\n" + t
              open(p,'w').write(t)
              print('fixed app gradle')
          p2 = 'android/build.gradle'
          t2 = open(p2).read()
          if 'resolutionStrategy' not in t2:
              t2 = t2.replace('allprojects {', 'allprojects {\\n configurations.all { resolutionStrategy { force \\'org.jetbrains.kotlin:kotlin-stdlib:1.8.22\\' force \\'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22\\' } }')
              open(p2,'w').write(t2)
              print('fixed root gradle')
          PYEOF
      - name: Setup Signing
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FPS, OU=Dev, O=FPS, L=Lahore, C=PK"
          python3 -c "
          p='android/app/build.gradle'
          t=open(p).read()
          t=t.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '123456'
                      keyAlias 'mykey'
                      keyPassword '123456'
                  }
              }''')
          t=t.replace('buildTypes {', 'buildTypes { release { signingConfig signingConfigs.release }')
          open(p,'w').write(t)
          print('signing fixed')
          "
      - run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
