name: Build Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm install --legacy-peer-deps
      - run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          rm -rf android
          npx cap add android
      - run: npm run build
      - run: npx cap sync android
      - name: Setup Signing
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias mykey -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FPS, OU=Dev, O=FPS, L=Lahore, C=PK"
          python3 -c "
          p='android/app/build.gradle'
          t=open(p).read()
          t=t.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword '123456'
                      keyAlias 'mykey'
                      keyPassword '123456'
                  }
              }''')
          t=t.replace('buildTypes {', 'buildTypes { release { signingConfig signingConfigs.release }')
          open(p,'w').write(t)
          print('signing fixed')
          "
      - run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
