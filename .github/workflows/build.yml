name: Build FPS Booster Pro APK & AAB
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies - FIXED
        run: npm install --legacy-peer-deps --force

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Bundle to Android Assets
        run: |
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          if [ -f capacitor.config.json ]; then
            cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          fi

      - name: Setup Java 21 - For SDK 36
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK - Preinstalled Wala - 404 FIX
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          ls $ANDROID_HOME/cmdline-tools/
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Release Keystore
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/keystore.jks" ]; then
            keytool -genkeypair -v -keystore android/app/keystore.jks -alias fpsbooster -keyalg RSA -keysize 2048 -validity 10000 -storepass fpsbooster120 -keypass fpsbooster120 -dname "CN=FPS Booster, OU=Gaming, O=FPS Booster Pro, L=City, S=State, C=US"
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x android/gradlew
          ls -lh android/gradlew

      - name: Build Android Debug & Release APK + Release AAB
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore.jks
          KEYSTORE_PASSWORD: fpsbooster120
          KEY_ALIAS: fpsbooster
          KEY_PASSWORD: fpsbooster120
        run: |
          ./gradlew clean assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Verify APK & AAB Outputs
        run: |
          find android/app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} \;

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-APK
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
