name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 20.0
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          accept-android-sdk-licenses: true

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/cli @capacitor/core @capacitor/android --legacy-peer-deps
          rm -rf android
          npx cap init "FPS Booster" com.fpsbooster.app --web-dir=dist
          npx cap add android
          npx cap sync android
          ls -la android/

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v -keystore android/app/release.keystore -alias fpsbooster -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=FPS Booster, OU=Dev, O=FPS, L=Lahore, ST=Punjab, C=PK"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Build Android Release AAB
        run: cd android && ./gradlew bundleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FPS-Booster-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
