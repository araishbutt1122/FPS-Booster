apply plugin: 'com.android.application'

android {
    namespace "com.fpsbooster.pro"
    compileSdk 34

    defaultConfig {
        applicationId "com.fpsbooster.pro"
        minSdk 23
        targetSdk 34
        versionCode 24
        versionName "2.4 PRO"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // Self-signed release / CI keystore support
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "fpsbooster120"
            keyAlias System.getenv("KEY_ALIAS") ?: "fpsbooster"
            keyPassword System.getenv("KEY_PASSWORD") ?: "fpsbooster120"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}
