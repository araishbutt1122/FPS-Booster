apply plugin: 'com.android.application'

android {
    namespace "com.fpsbooster.pro"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.fpsbooster.pro"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "2.4 PRO"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        release {
            // Self-signed release / CI keystore support
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "fpsbooster120"
            keyAlias System.getenv("KEY_ALIAS") ?: "fpsbooster"
            keyPassword System.getenv("KEY_PASSWORD") ?: "fpsbooster120"
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-ktx:$androidxCoreKTXVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation 'com.google.android.material:material:1.12.0'
}
